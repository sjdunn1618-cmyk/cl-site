name: FieldRoutes sync
on:
  workflow_dispatch:
    inputs:
      hours_ciphertext:
        description: 'Encrypted Homebase snapshot (no raw hours)'
        required: true
        type: string
      validation_public_key:
        description: 'One-run public encryption key for private validation output'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: fieldroutes-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Mountain-time gate
        id: window
        run: |
          python - <<'PYCODE'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/Denver"))
          scheduled = os.environ["GITHUB_EVENT_NAME"] == "schedule"
          active = not scheduled or (now.weekday() < 6 and 7 <= now.hour <= 17)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={str(active).lower()}\n")
          PYCODE
      - name: Pull from FieldRoutes (read-only)
        if: steps.window.outputs.active == 'true' 
        env:
          HOURS_SNAPSHOT: ${{ inputs.hours_ciphertext }}
          HOURS_PRIVATE_KEY: ${{ secrets.HOURS_PRIVATE_KEY }}
          FR_KEY_1: ${{ secrets.FR_KEY_1 }}
          FR_TOKEN_1: ${{ secrets.FR_TOKEN_1 }}
          FR_KEY_2: ${{ secrets.FR_KEY_2 }}
          FR_TOKEN_2: ${{ secrets.FR_TOKEN_2 }}
          FR_KEY_3: ${{ secrets.FR_KEY_3 }}
          FR_TOKEN_3: ${{ secrets.FR_TOKEN_3 }}
          FR_KEY_4: ${{ secrets.FR_KEY_4 }}
          FR_TOKEN_4: ${{ secrets.FR_TOKEN_4 }}
          FR_KEY_5: ${{ secrets.FR_KEY_5 }}
          FR_TOKEN_5: ${{ secrets.FR_TOKEN_5 }}
          FR_KEY_6: ${{ secrets.FR_KEY_6 }}
          FR_TOKEN_6: ${{ secrets.FR_TOKEN_6 }}
          FR_KEY_8: ${{ secrets.FR_KEY_8 }}
          FR_TOKEN_8: ${{ secrets.FR_TOKEN_8 }}
          FR_KEY_9: ${{ secrets.FR_KEY_9 }}
          FR_TOKEN_9: ${{ secrets.FR_TOKEN_9 }}
          FR_KEY_10: ${{ secrets.FR_KEY_10 }}
          FR_TOKEN_10: ${{ secrets.FR_TOKEN_10 }}
        run: python fr_pull.py
      - name: Verify changed sections only (validation; no publish)
        run: |
          python - <<'PYCODE'
          import json, subprocess
          before = json.loads(subprocess.check_output(["git", "show", "HEAD:data.json"]))
          after = json.load(open("data.json"))
          for key, value in before.items():
              if key == "board":
                  for section, original in value.items():
                      if section not in ("saves", "renewals", "tiers", "day", "metricsMeta"):
                          assert after["board"][section] == original, section
                  assert set(after["board"]) - set(value) <= {"day", "metricsMeta"}
              elif key != "meta":
                  assert after[key] == value, key
          assert after["meta"]["source"] == "fieldroutes"
          print("Validation passed. No data was committed or published.")
          PYCODE
      - name: Validate minimized tier output
        run: |
          python - <<'PYCODE'
          import json
          d=json.load(open("data.json"))
          for b in (d["board"]["tiers"], d["board"]["day"]["tiers"]):
              assert b["status"] in ("ok","unavailable","tie-review")
              assert all("hours" not in r for r in b["rows"])
          print("Tier schema and private-hours exclusion passed; nothing published.")
          PYCODE
      - name: Encrypt private validation result
        env:
          VALIDATION_PUBLIC_KEY: ${{ inputs.validation_public_key }}
        run: |
          python - <<'PYCODE'
          import json,os
          from hours_crypto import encrypt
          data=json.load(open("data.json"))
          board=data["board"]
          result={k:board[k] for k in ("saves","renewals","tiers","day","metricsMeta")}
          open("validation.enc","w").write(encrypt(result,os.environ["VALIDATION_PUBLIC_KEY"]))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-validation
          path: validation.enc
          retention-days: 1
